<style>
    :root {
      --primary: #17171c;
      --ink: #212121;
      --canvas: #ffffff;
      --soft-stone: #eeece7;
      --deep-green: #004d40;
      --coral: #ff7759;
      --action-blue: #1863dc;
      --muted: #93939f;
      --slate: #75758a;
      --hairline: #d9d9dd;
      --border-light: #e5e7eb;

    body {

    /* Header */

      padding: 14px 20px; background: var(--canvas);
      border-bottom: 1px solid var(--border-light);

    }
    .brand-lockup { display: flex; align-items: center; gap: 12px; margin-right: auto; }

    .page-title { font-family: 'Space Grotesk', 'Inter', sans-serif; font-size: 30px; font-weight: 600; letter-spacing: -0.4px; margin: 0; }
    .page-lede { color: var(--body-muted); font-size: 14px; margin: 6px 0 0; max-width: 640px; }
    .page-intro { padding: 26px 0 18px; }

    .card-soft {
      background: var(--canvas); border: 1px solid var(--border-light);

    /* Programme rows are links: keep the card box instead of the browser's inline link styling. */
    a.programme-card { display: block; text-decoration: none; color: inherit; }
    .programme-card { padding: 16px 20px; margin-bottom: 8px; transition: box-shadow 0.15s ease, border-color 0.15s ease; }
    .programme-card:hover { border-color: var(--action-blue); box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
    .cursor-pointer { cursor: pointer; }
    .font-medium { font-weight: 500; }
    .text-sm { font-size: 13px; }
    .text-muted { color: var(--muted); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .mt-1 { margin-top: 4px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-4 { margin-bottom: 16px; }
    .mb-6 { margin-bottom: 24px; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .flex-1 { flex: 1; }

    .detail-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

      background: var(--canvas-muted); border: 1px solid var(--border-light);
      border-radius: var(--radius-pill); padding: 3px 10px;
    }

    .section-card {
      background: var(--canvas); border: 1px solid var(--border-light); border-radius: var(--radius-md);
      padding: 20px; margin-bottom: 20px;
    }
    .section-heading {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px;
    }
    .section-heading h3 { font-family: 'Space Grotesk', 'Inter', sans-serif; font-size: 18px; font-weight: 500; margin: 0; }
    .section-heading .count { font-size: 12px; color: var(--muted); }
    .section-heading-actions { display: flex; align-items: center; gap: 12px; }

    .table-wrap { overflow-x: auto; }
    .scroll-panel { max-height: 420px; overflow-y: auto; overflow-x: auto; border-radius: var(--radius-sm); }
    .scroll-panel table.detail-table th { position: sticky; top: 0; z-index: 1; }
    .scroll-hint { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
    table.detail-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.detail-table th, table.detail-table td {

    }
    table.detail-table th {
      font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase;
      color: var(--slate); background: var(--canvas-muted);
    }
    table.detail-table th:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
    table.detail-table th:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
    table.detail-table td code {
      font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; color: var(--primary);
    }
    .mqf-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .action-cell { width: 48px; text-align: right !important; white-space: nowrap; }
    .icon-button {

    .empty-note { color: var(--muted); font-size: 14px; padding: 12px 0; text-align: center; }

    .state-chip.chip-shared { background: #e8f0fe; color: #1a56b0; }
    .state-chip.chip-warn { background: #fdf3e3; color: var(--action-amber); }
    .state-chip.chip-done { background: #edf8f1; color: var(--action-green); border: 1px solid #bce2c9; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 16px; }
    .admin-editor { margin-top: 20px; padding: 16px; border: 1px solid var(--border-light); border-radius: var(--radius-sm); background: var(--canvas-muted); }
    .admin-editor-title { margin: 0 0 6px; font-family: 'Space Grotesk', 'Inter', sans-serif; font-size: 16px; }

    .sdg-card:hover { border-color: var(--action-blue); }
    .sdg-code { font-size: 12px; font-weight: 700; letter-spacing: 0.6px; color: var(--action-blue); }
    .sdg-label { font-size: 14px; font-weight: 600; color: var(--ink); }
    .sdg-count { font-size: 13px; color: var(--ink); }
    .sdg-sub { font-size: 12px; color: var(--muted); }

    .dash { margin: 22px 0 8px; padding: 20px 22px; background: var(--canvas); border: 1px solid var(--border-light); border-radius: var(--radius-md); }
    .dash-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
    .dash-title { font-family: 'Space Grotesk', 'Inter', sans-serif; font-size: 20px; font-weight: 600; margin: 2px 0 4px; color: var(--ink); }
    .dash-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .dash-card { background: var(--canvas-muted); border-radius: var(--radius-sm); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
    .dash-label { font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: var(--slate); }
    .dash-value { font-family: 'Space Grotesk', 'Inter', sans-serif; font-size: 26px; font-weight: 600; color: var(--ink); line-height: 1.15; }
    .dash-warn { color: var(--action-amber); }
    .dash-note { font-size: 12px; color: var(--muted); }
    .dash-domains { display: flex; flex-direction: column; gap: 1px; margin-top: 6px; font-size: 11px; line-height: 1.4; color: var(--muted); }
    .dash-domain-on { color: var(--deep-green); font-weight: 600; }
    .dash-gates { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; font-size: 12px; color: var(--muted); }

    .dash-bar > span { display: block; height: 100%; background: var(--deep-green); border-radius: 999px; }
    .modal-wide { max-width: 980px; }
    .modal-section { font-family: 'Space Grotesk', 'Inter', sans-serif; font-size: 16px; font-weight: 600; margin: 20px 0 10px; }

    .cv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 40px; }

    .review-toggle { display: flex; align-items: center; gap: 12px; width: 100%; background: transparent; border: none; padding: 2px 0; cursor: pointer; text-align: left; }
    .review-toggle-title { font-family: 'Space Grotesk', 'Inter', sans-serif; font-size: 18px; font-weight: 600; color: var(--ink); }
    .review-toggle-meta { margin-left: auto; color: var(--muted); font-size: 13px; }
    .review-chevron { color: var(--muted); font-size: 13px; }
    .review-body { padding-top: 16px; }
    .review-headline { font-weight: 600; margin: 2px 0 8px; color: var(--ink); }
    .review-label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: var(--ink); }
    .review-textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--hairline); border-radius: var(--radius-sm); font: inherit; color: var(--ink); background: var(--canvas); resize: vertical; }

    .state-chip {

    .modal {

    .modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 22px 24px 12px; }
    .modal-title { font-family: 'Space Grotesk', 'Inter', sans-serif; font-size: 21px; font-weight: 500; margin: 0; }
    .modal-subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .modal-close { border: none; background: transparent; color: var(--slate); font-size: 24px; line-height: 1; cursor: pointer; padding: 2px 5px; }
    .modal-body { padding: 8px 24px 24px; }
    .form-field { display: grid; gap: 6px; margin-top: 16px; }
    .field-note { margin: 0; font-size: 12px; line-height: 1.45; color: var(--slate); }
    .form-field label { font-size: 12px; font-weight: 600; letter-spacing: 0.7px; color: var(--slate); text-transform: uppercase; }

    /* Responsive */
    @media (max-width: 640px) {

      .detail-title { font-size: 21px; }

      .level-header h2 { font-size: 20px; }

      .faculty-label { max-width: calc(100% - 120px); font-size: 12px; padding: 6px 14px; }
      .faculty-accordion-count { font-size: 12px; }
    }
</style>
