<script>
  /* Admin console for the review cycle. BOOT is injected by Index.html. */
  var ADMIN_BOOT = window.BOOT || {};

  function adminDate(offsetDays) {
    var date = new Date();
    if (offsetDays) date.setDate(date.getDate() + offsetDays);
    var month = ('0' + (date.getMonth() + 1)).slice(-2);
    var day = ('0' + date.getDate()).slice(-2);
    return date.getFullYear() + '-' + month + '-' + day;
  }

  function initAdminApp() {
    new Vue({
      el: '#app',
      data: {
        page: ADMIN_BOOT.page || 'review',
        lang: 'en',
        currentUser: ADMIN_BOOT.user || null,
        sessionToken: ADMIN_BOOT.token || '',
        baseUrl: ADMIN_BOOT.baseUrl || '',
        review: ADMIN_BOOT.review || { active: null, periods: [], faculties: [], unregistered: [], programmesTotal: 0 },
        directory: ADMIN_BOOT.directory || { rows: [] },
        admins: ADMIN_BOOT.admins || { rows: [], roles: [] },
        showAdmins: false,
        adminForm: { rowIndex: 0, name: '', email: '', role: 'PPA', faculty: 'PPS' },
        dirForm: { rowIndex: 0, faculty: '', name: '', email: '', position: '' },
        form: { cutoffDate: adminDate(0), closesDate: adminDate(30), title: '' },
        busy: false,
        error: null,
        notice: null,
        backupUrl: '',
        changeRequests: [],
        pendingChangeCount: ADMIN_BOOT.pendingChangeCount || 0,
        canApproveChanges: !!ADMIN_BOOT.canApproveChanges,
        exportModal: { open: false, period: null, busy: false, error: null, result: null }
      },
      computed: {
        userLabel: function () {
          if (!this.currentUser) return '';
          return this.currentUser.name + ' — ' + this.currentUser.faculty;
        }
      },
      methods: {
        t: function (key) {
          var table = MESSAGES[this.lang] || MESSAGES.ms;
          return Object.prototype.hasOwnProperty.call(table, key) ? table[key] : (MESSAGES.ms[key] || key);
        },
        setLang: function (code) {
          this.lang = ['ms', 'en', 'ar'].indexOf(code) === -1 ? 'ms' : code;
          try { localStorage.setItem('ggn-lang', this.lang); } catch (e) {}
        },
        closeEdit: function () {},
        apply: function (payload) {
          if (!payload) return;
          this.$set(this.review, 'active', payload.active || null);
          this.$set(this.review, 'periods', payload.periods || []);
          this.$set(this.review, 'faculties', payload.faculties || []);
          this.$set(this.review, 'unregistered', payload.unregistered || []);
          this.$set(this.review, 'programmesTotal', payload.programmesTotal || 0);
        },
        openPeriod: function () {
          var self = this;
          if (this.busy || !this.form.cutoffDate) return;
          this.busy = true;
          this.error = null;
          this.notice = null;
          google.script.run
            .withSuccessHandler(function (payload) {
              self.busy = false;
              self.apply(payload);
              self.notice = 'Sesi dibuka. Fakulti kini boleh mengemas kini status.';
            })
            .withFailureHandler(function (err) {
              self.busy = false;
              self.error = err && err.message ? err.message : 'Sesi tidak dapat dibuka.';
            })
            .saveReviewPeriodApi({
              cutoffDate: this.form.cutoffDate,
              closesDate: this.form.closesDate,
              title: this.form.title,
              state: 'Open'
            }, this.sessionToken);
        },
        syncBackup: function () {
          var self = this;
          if (this.busy) return;
          this.busy = true;
          this.error = null;
          this.notice = null;
          google.script.run
            .withSuccessHandler(function (result) {
              self.busy = false;
              self.backupUrl = result && result.url ? result.url : '';
              self.notice = result ? ('Backup Excel dikemas kini (' + result.rows + ' program × ' + result.periods + ' sesi).') : 'Backup dikemas kini.';
            })
            .withFailureHandler(function (err) {
              self.busy = false;
              self.error = err && err.message ? err.message : 'Backup tidak dapat dijana.';
            })
            .syncReviewBackupApi(this.sessionToken);
        },
        sendEmails: function (kind, dryRun) {
          var self = this;
          if (this.busy) return;
          this.busy = true;
          this.error = null;
          this.notice = null;
          google.script.run
            .withSuccessHandler(function (result) {
              self.busy = false;
              self.notice = (result && result.dryRun ? 'Ujian: ' : '') + 'E-mel dihantar: ' + (result ? result.sent : 0) + '.';
            })
            .withFailureHandler(function (err) {
              self.busy = false;
              self.error = err && err.message ? err.message : 'E-mel tidak dapat dihantar.';
            })
            .sendReviewEmailsApi(kind, dryRun, this.sessionToken);
        },
        editDirectory: function (person) {
          this.dirForm = {
            rowIndex: person.rowIndex,
            faculty: person.faculty,
            name: person.name,
            email: person.email,
            position: person.position
          };
          this.error = null;
          this.notice = null;
        },
        resetDirectory: function () {
          this.dirForm = { rowIndex: 0, faculty: '', name: '', email: '', position: '' };
        },
        saveDirectory: function () {
          var self = this;
          this.busy = true;
          this.error = null;
          this.notice = null;
          google.script.run
            .withSuccessHandler(function (payload) {
              self.busy = false;
              self.$set(self, 'directory', payload || { rows: [] });
              self.notice = self.dirForm.rowIndex ? 'Kenalan dikemas kini.' : 'Kenalan baharu ditambah.';
              self.resetDirectory();
            })
            .withFailureHandler(function (err) {
              self.busy = false;
              self.error = err && err.message ? err.message : 'Direktori tidak dapat disimpan.';
            })
            .saveDirectoryAdminApi(this.dirForm, this.sessionToken);
        },
        removeDirectory: function (person) {
          var self = this;
          this.busy = true;
          this.error = null;
          this.notice = null;
          google.script.run
            .withSuccessHandler(function (payload) {
              self.busy = false;
              self.$set(self, 'directory', payload || { rows: [] });
              self.notice = 'Kenalan dipadam daripada direktori.';
            })
            .withFailureHandler(function (err) {
              self.busy = false;
              self.error = err && err.message ? err.message : 'Kenalan tidak dapat dipadam.';
            })
            .removeDirectoryAdminApi(person.rowIndex, this.sessionToken);
        },
        loadChangeRequests: function () {
          var self = this;
          google.script.run
            .withSuccessHandler(function (rows) { self.changeRequests = rows || []; })
            .withFailureHandler(function (err) {
              self.changeRequests = [];
              self.error = 'Change requests could not be loaded: ' + (err && err.message ? err.message : 'unknown error');
            })
            .listChangeRequestsApi(this.sessionToken);
        },
        decideChange: function (row, decision) {
          var self = this;
          this.error = null;
          this.notice = null;
          google.script.run
            .withSuccessHandler(function (result) {
              self.notice = decision === 'approve' ? 'Change approved and applied.' : 'Change rejected.';
              self.loadChangeRequests();
            })
            .withFailureHandler(function (err) {
              self.error = err && err.message ? err.message : 'The decision could not be saved.';
            })
            .decideChangeRequestApi(row.requestId, decision, this.sessionToken);
        },
        toggleAdmins: function () { this.showAdmins = !this.showAdmins; },
        resetAdmin: function () {
          this.adminForm = { rowIndex: 0, name: '', email: '', role: 'PPA', faculty: 'PPS' };
        },
        editAdmin: function (admin) {
          this.showAdmins = true;
          this.adminForm = { rowIndex: admin.rowIndex, name: admin.name, email: admin.email, role: admin.role, faculty: admin.faculty };
        },
        saveAdmin: function () {
          var self = this;
          this.busy = true;
          this.error = null;
          this.notice = null;
          google.script.run
            .withSuccessHandler(function (payload) {
              self.busy = false;
              self.$set(self, 'admins', payload || { rows: [], roles: [] });
              self.notice = 'Senarai pentadbir dikemas kini.';
              self.resetAdmin();
            })
            .withFailureHandler(function (err) {
              self.busy = false;
              self.error = err && err.message ? err.message : 'Pentadbir tidak dapat disimpan.';
            })
            .saveReviewRoleApi(this.adminForm, this.sessionToken);
        },
        removeAdmin: function (admin) {
          var self = this;
          if (this.busy) return;
          this.busy = true;
          this.error = null;
          self.notice = null;
          google.script.run
            .withSuccessHandler(function (payload) {
              self.busy = false;
              self.$set(self, 'admins', payload || { rows: [], roles: [] });
              self.notice = 'Akses pentadbir dibuang.';
            })
            .withFailureHandler(function (err) {
              self.busy = false;
              self.error = err && err.message ? err.message : 'Akses tidak dapat dibuang.';
            })
            .removeReviewRoleApi(admin.rowIndex, this.sessionToken);
        },
        openExportModal: function (period) {
          this.exportModal = { open: true, period: period, busy: false, error: null, result: null };
        },
        closeExportModal: function () {
          if (this.exportModal.busy) return;
          this.exportModal = { open: false, period: null, busy: false, error: null, result: null };
        },
        runExport: function () {
          var self = this;
          if (!this.exportModal.open || this.exportModal.busy) return;
          this.exportModal.busy = true;
          this.exportModal.error = null;
          google.script.run
            .withSuccessHandler(function (result) {
              self.exportModal.busy = false;
              self.exportModal.result = result;
              self.notice = self.t('export_done_prefix') + ' ' + result.written +
                ' ' + self.t('export_done_rows') + ' (' + result.firstColumn + ', ' + result.period + ').';
            })
            .withFailureHandler(function (err) {
              self.exportModal.busy = false;
              self.exportModal.error = err && err.message ? err.message : 'The export failed.';
            })
            .exportPeriodToSheetApi(self.exportModal.period.periodId, self.sessionToken);
        },
        setState: function (periodId, state) {
          var self = this;
          if (this.busy) return;
          this.busy = true;
          this.error = null;
          this.notice = null;
          google.script.run
            .withSuccessHandler(function (payload) {
              self.busy = false;
              self.apply(payload);
              self.notice = state === 'Open' ? 'Sesi dibuka.' : 'Sesi ditutup.';
              if (state === 'Closed') {
                var closed = (self.review.periods || []).filter(function (row) {
                  return String(row.periodId) === String(periodId);
                })[0];
                if (closed) self.openExportModal(closed);
              }
            })
            .withFailureHandler(function (err) {
              self.busy = false;
              self.error = err && err.message ? err.message : 'Status sesi tidak dapat diubah.';
            })
            .setReviewPeriodStateApi(periodId, state, this.sessionToken);
        }
      },
      mounted: function () {
        this.loadChangeRequests();
        try {
          var saved = localStorage.getItem('ggn-lang');
          if (saved && ['ms', 'en', 'ar'].indexOf(saved) !== -1) this.lang = saved;
        } catch (e) {}
      }
    });
  }

  document.addEventListener('DOMContentLoaded', initAdminApp);
</script>
