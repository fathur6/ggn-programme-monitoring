<script>
var MIN_LOADING_MS = 1500;
var _loadingStartTime = 0;
var _loadingBarRAF = 0;

function startLoadingBar() {
  var bar = document.getElementById('loadingBarFill');
  if (!bar) return;
  _loadingStartTime = Date.now();
  if (_loadingBarRAF) cancelAnimationFrame(_loadingBarRAF);
  bar.style.width = '0%';
  function update() {
    var elapsed = Date.now() - _loadingStartTime;
    var pct = Math.min(100, (elapsed / MIN_LOADING_MS) * 100);
    bar.style.width = pct + '%';
    if (elapsed < MIN_LOADING_MS) _loadingBarRAF = requestAnimationFrame(update);
  }
  _loadingBarRAF = requestAnimationFrame(update);
}

function showLoadingOverlay() {
  var el = document.getElementById('loadingOverlay');
  if (!el) return;
  el.style.display = 'flex';
  el.classList.remove('fade-out');
  startLoadingBar();
}

function hideLoadingOverlay() {
  var elapsed = Date.now() - _loadingStartTime;
  var remaining = Math.max(0, MIN_LOADING_MS - elapsed);
  if (_loadingBarRAF) cancelAnimationFrame(_loadingBarRAF);
  var bar = document.getElementById('loadingBarFill');
  if (bar) bar.style.width = '100%';
  function doHide() {
    var el = document.getElementById('loadingOverlay');
    if (el) {
      el.classList.add('fade-out');
      setTimeout(function() {
        el.style.display = 'none';
        el.classList.remove('fade-out');
        if (bar) bar.style.width = '0%';
      }, 500);
    }
  }
  if (remaining > 0) setTimeout(doHide, remaining);
  else doHide();
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

var MQF_CLUSTERS = [
  {
    name: 'Knowledge and Understanding',
    domains: [
      { id: 'MQF 1', label: 'Knowledge and Understanding', description: 'The ability to understand and systematically apply the core concepts, principles, facts, and theories within a specific discipline or field of study.' }
    ]
  },
  {
    name: 'Cognitive Skills',
    domains: [
      { id: 'MQF 2', label: 'Cognitive Skills', description: 'Intellectual and thinking capabilities that allow students to analyze data, think critically, innovate, and solve complex problems within their field.' }
    ]
  },
  {
    name: 'Functional Work Skills',
    domains: [
      { id: 'MQF 3a', label: 'Practical Skills', description: 'The technical, hands-on, and operational skills required to plan, manage, and execute tasks safely and effectively within a specific discipline.' },
      { id: 'MQF 3b', label: 'Interpersonal Skills', description: 'The ability to work collaboratively, interact positively, and build professional relationships inside a team, with stakeholders, or within a community.' },
      { id: 'MQF 3c', label: 'Communication Skills', description: 'The capacity to convey ideas, information, and arguments clearly, effectively, and professionally through written, oral, or visual means.' },
      { id: 'MQF 3d', label: 'Digital Skills', description: 'The ability to leverage digital tools, software, applications, and networks to access, process, and manage data or information securely.' },
      { id: 'MQF 3e', label: 'Numeracy Skills', description: 'The proficiency to use quantitative data, mathematics, and statistical concepts accurately to interpret information and solve problems.' },
      { id: 'MQF 3f', label: 'Leadership, Autonomy, and Responsibilities', description: 'The capacity to demonstrate accountability, decision-making autonomy, and ethical guidance when leading teams or managing professional tasks.' }
    ]
  },
  {
    name: 'Personal and Entrepreneurial Skills',
    domains: [
      { id: 'MQF 4a', label: 'Personal Skills', description: 'Life-long learning attributes, self-control, resilience, and confidence needed for positive self-development and personal growth.' },
      { id: 'MQF 4b', label: 'Entrepreneurial Skills', description: 'The ability to identify opportunities, think innovatively, take calculated risks, and demonstrate business or project management acumen.' }
    ]
  },
  {
    name: 'Ethics and Professionalism',
    domains: [
      { id: 'MQF 5', label: 'Ethics and Professionalism', description: 'The integration of strong self-identity, high integrity, moral values, and social responsibility in compliance with established professional codes of conduct.' }
    ]
  }
];

var MQF_DOMAIN_FLAT = [];
for (var _c = 0; _c < MQF_CLUSTERS.length; _c++) {
  for (var _d = 0; _d < MQF_CLUSTERS[_c].domains.length; _d++) {
    MQF_DOMAIN_FLAT.push(MQF_CLUSTERS[_c].domains[_d]);
  }
}

var TAXONOMY_LEVELS = {
  Cognitive: [
    { id: 'C1', label: 'Remember' },
    { id: 'C2', label: 'Understand' },
    { id: 'C3', label: 'Apply' },
    { id: 'C4', label: 'Analyze' },
    { id: 'C5', label: 'Evaluate' },
    { id: 'C6', label: 'Create' }
  ],
  Affective: [
    { id: 'A1', label: 'Receive' },
    { id: 'A2', label: 'Respond' },
    { id: 'A3', label: 'Value' },
    { id: 'A4', label: 'Organize' },
    { id: 'A5', label: 'Internalize' },
    { id: 'A6', label: 'Characterize' }
  ],
  Psychomotor: [
    { id: 'P1', label: 'Imitation' },
    { id: 'P2', label: 'Manipulation' },
    { id: 'P3', label: 'Precision' },
    { id: 'P4', label: 'Articulation' },
    { id: 'P5', label: 'Naturalization' },
    { id: 'P6', label: 'Origination' }
  ]
};

var SC_CATEGORIES = [
  { name: 'Ways of Thinking', codes: ['SC1', 'SC2', 'SC3'] },
  { name: 'Ways of Practicing', codes: ['SC4', 'SC5', 'SC6'] },
  { name: 'Ways of Being', codes: ['SC7', 'SC8'] }
];

function initApp() {
  showLoadingOverlay();

  var sessionEmailEl = document.getElementById('session-email');
  var sessionUserEl = document.getElementById('session-user');
  var sessionEmail = sessionEmailEl ? sessionEmailEl.textContent.trim() : '';
  var sessionUserRaw = sessionUserEl ? sessionUserEl.textContent.trim() : '';

  if (sessionEmail && sessionUserRaw) {
    CURRENT_USER = JSON.parse(sessionUserRaw);
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initVueApp();
    hideLoadingOverlay();
    return;
  }

  hideLoadingOverlay();
  document.getElementById('login-page').style.display = 'flex';
}

var CURRENT_USER = null;

function projectMappingMatrixRow_(plo, tfReferences) {
  var domains = Array.isArray(plo.mqfDomains) ? plo.mqfDomains : [];
  var mqf = {};
  domains.forEach(function(domain) { mqf[domain] = true; });
  var tf = Array.isArray(plo.tfIds) ? plo.tfIds : (Array.isArray(tfReferences) ? tfReferences : []).filter(function(reference) {
    return Array.isArray(reference.mqfDomains) && reference.mqfDomains.some(function(domain) {
      return domains.indexOf(domain) !== -1;
    });
  }).map(function(reference) { return reference.code; }).sort();
  return {
    code: plo.code,
    mqf: mqf,
    tf: tf,
    sdg: Array.isArray(plo.sdgIds) ? plo.sdgIds : [],
    sc: Array.isArray(plo.scIds) ? plo.scIds : []
  };
}

function initVueApp() {
new Vue({
  el: '#app',
  data: {
    user: CURRENT_USER || { email: '', role: '', name: '', faculty: '' },
    currentView: 'dashboard',
    currentProgramme: null,
    programmes: [],
    search: '',
    loading: false,
    error: null,
    pendingOpen: false,
    pendingDeletions: [],
    toast: null,
    toastTimer: null,
     mqfClusters: MQF_CLUSTERS,
     taxonomyLevels: TAXONOMY_LEVELS,
     scCategories: SC_CATEGORIES,
    subgroupOpen: {},
    preparing: false
    ,dashboard: null
     ,dashboardLoading: false
     ,dashboardLoadingProgress: 0
     ,dashboardLoadingStatus: ''
     ,dashboardLoadingTimer: null
     ,dashboardError: null
     ,selectedFaculty: ''
     ,expandedFaculty: ''
     ,facultyDetails: {}
     ,facultyDetailsLoading: {}
     ,facultyDetailsError: {}
     ,researchCategory: 'information'
     ,researchPanel: 'profile'
     ,researchProfile: null
     ,researchPEOs: []
     ,researchPLOs: []
     ,researchMappings: {}
     ,researchReferences: {MQF: [], TF: [], SDG: [], SC: []}
     ,researchCoverage: null
      ,researchReview: null
      ,assessmentMapping: null
      ,assessmentReview: null
      ,assessmentPage: 'progress'
      ,assessmentDirty: false
      ,assessmentSaveState: 'clean'
      ,researchStatus: 'Draft'
      ,researchDirty: false
      ,researchSaveState: 'clean'
       ,researchLoading: false
       ,researchError: null
       ,researchWorkspaceFatalError: null
       ,researchLoadGeneration: 0
       ,researchLoadProgrammeId: ''
       ,researchEndpointNames: ['profile', 'peos', 'plos', 'references', 'mappings', 'coverage', 'review']
       ,researchEndpointErrors: {profile: null, peos: null, plos: null, references: null, mappings: null, coverage: null, review: null}
       ,researchEndpointLoading: {profile: false, peos: false, plos: false, references: false, mappings: false, coverage: false, review: false}
       ,assessmentWorkspaceFatalError: null
       ,assessmentEndpointNames: ['mapping', 'review']
       ,assessmentEndpointErrors: {mapping: null, review: null}
       ,assessmentEndpointLoading: {mapping: false, review: false}
       ,dirty: false
    ,accessRequest: { targetFaculty: '', mqaCode: '', reason: '', scope: 'programme' }
    ,myAccessRequests: []
    ,accessRequests: []
     ,governanceItems: []
     ,facultyUserDirectory: []
  },
  computed: {
    filteredProgrammes: function() {
      var self = this;
      if (!this.search) return this.programmes;
      var q = this.search.toLowerCase();
      return this.programmes.filter(function(p) {
        return p.name.toLowerCase().indexOf(q) > -1 ||
               p.mqaCode.toLowerCase().indexOf(q) > -1 ||
               p.progCode.toLowerCase().indexOf(q) > -1;
      });
    },
    groupedProgrammes: function() {
      var filtered = this.filteredProgrammes;
      var isAdmin = this.user.role === 'Admin';
      var structureOrder = ['Doctorate', 'Masters', 'Other'];

      if (isAdmin) {
        var structMap = {};
        for (var s = 0; s < structureOrder.length; s++) {
          structMap[structureOrder[s]] = {};
        }
        for (var i = 0; i < filtered.length; i++) {
          var p = filtered[i];
          var lvl = p.level || 'Other';
          if (!structMap[lvl]) structMap[lvl] = {};
          var fac = p.faculty || 'Unknown';
          if (!structMap[lvl][fac]) structMap[lvl][fac] = [];
          structMap[lvl][fac].push(p);
        }
        var result = [];
        for (var s2 = 0; s2 < structureOrder.length; s2++) {
          var lvlName = structureOrder[s2];
          var faculties = structMap[lvlName];
          var facKeys = Object.keys(faculties).sort();
          if (facKeys.length === 0) continue;
          var subGroups = [];
          var total = 0;
          for (var f = 0; f < facKeys.length; f++) {
            var progList = faculties[facKeys[f]];
            subGroups.push({ title: progList[0].facultyFull || facKeys[f], key: lvlName + '-' + facKeys[f], count: progList.length, programmes: progList });
            total += progList.length;
          }
          result.push({ title: lvlName, key: lvlName, count: total, subGroups: subGroups });
        }
        return result;
      } else {
        var facMap = {};
        for (var i2 = 0; i2 < filtered.length; i2++) {
          var p2 = filtered[i2];
          var fac2 = p2.faculty || 'Unknown';
          if (!facMap[fac2]) facMap[fac2] = {};
          var lvl2 = p2.level || 'Other';
          if (!facMap[fac2][lvl2]) facMap[fac2][lvl2] = [];
          facMap[fac2][lvl2].push(p2);
        }
        var result2 = [];
        var facNames2 = Object.keys(facMap).sort();
        for (var f2 = 0; f2 < facNames2.length; f2++) {
          var fn = facNames2[f2];
          var levels = facMap[fn];
          var subs = [];
          var total2 = 0;
          var firstProg = null;
          for (var s3 = 0; s3 < structureOrder.length; s3++) {
            var ln = structureOrder[s3];
            if (levels[ln]) {
              if (!firstProg) firstProg = levels[ln][0];
              subs.push({ title: ln, key: fn + '-' + ln, count: levels[ln].length, programmes: levels[ln], cssClass: ln });
              total2 += levels[ln].length;
            }
          }
          result2.push({ title: (firstProg ? firstProg.facultyFull : fn), key: fn, count: total2, subGroups: subs });
        }
        return result2;
      }
    },
     taxonomyOptions: function() {
       return Object.keys(this.taxonomyLevels).reduce(function(all, key) { return all.concat(this.taxonomyLevels[key]); }.bind(this), []);
     },
      reviewStatusClass: function() {
        return this.researchStatus === 'Ready for review' || this.researchStatus === 'Approved' ? 'status-good' : 'status-warn';
      },
       mappingMatrixRows: function() {
        var self = this;
        return this.researchPLOs.map(function(plo) {
           var mapping = self.researchMappings[plo.ploId || plo.code] || {};
           return projectMappingMatrixRow_({
             code: plo.code,
              mqfDomains: plo.mqfDomains,
              tfIds: mapping.tfIds || mapping.derivedTFIds,
              sdgIds: mapping.sdgIds,
             scIds: mapping.scIds
           }, self.researchReferences.TF);
         });
       },
       assessmentVisibleInstruments: function() {
         var prefix = this.assessmentPage === 'viva' ? 'VIVA_' : this.assessmentPage === 'thesis' ? 'THESIS_' : 'PROGRESS_';
         return (this.assessmentMapping || []).filter(function(instrument) { return String(instrument.code || '').indexOf(prefix) === 0; });
       },
       assessmentPageIssues: function() {
         var prefix = this.assessmentPage === 'viva' ? 'VIVA_' : this.assessmentPage === 'thesis' ? 'THESIS_' : 'PROGRESS_';
         var review = this.assessmentReview || {};
         return (review.critical || []).filter(function(issue) { return String(issue.instrumentCode || '').indexOf(prefix) === 0; });
       }
  },
  methods: {
    isResearchProgramme: function(programme) {
      if (!programme) return false;
      var mode = String(programme.mode || '').trim().toLowerCase();
      if (mode) return mode === 'research' || mode === 'postgraduate by research';
      return !!(programme.researchDetail);
    },
    showToast: function(msg) {
      var self = this;
      if (this.toastTimer) clearTimeout(this.toastTimer);
      this.toast = msg;
      this.toastTimer = setTimeout(function() { self.toast = null; }, 3000);
    },
    autoResize: function(ev) {
      var el = ev.target;
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    },
    autoResizeAll: function() {
      var self = this;
      this.$nextTick(function() {
        var els = document.querySelectorAll('.expand-textarea');
        for (var i = 0; i < els.length; i++) {
          els[i].style.height = 'auto';
          els[i].style.height = els[i].scrollHeight + 'px';
        }
      });
    },
    markDirty: function() {
      this.markResearchDirty();
    },
     markResearchDirty: function() {
      this.researchDirty = true;
      this.researchSaveState = 'dirty';
      this.dirty = true;
      },
      markAssessmentDirty: function() {
       this.assessmentDirty = true;
       this.assessmentSaveState = 'dirty';
       this.researchDirty = true;
       this.dirty = true;
      },
      assessmentProvenanceClass: function(provenance) {
       if (!provenance) return 'provenance-default';
       if (provenance.kind === 'faculty') return 'provenance-faculty';
       if (provenance.kind === 'derived') return 'provenance-derived';
       return 'provenance-default';
      },
       assessmentMQFLabel: function(item) {
        var selected = item && item.effective && item.effective.mqfDomains || [];
        if (!selected.length) return 'Select MQF domains';
        var selectedSet = selected.reduce(function(result, code) { result[String(code)] = true; return result; }, {});
        var labels = (this.researchReferences.MQF || []).filter(function(reference) {
          return selectedSet[String(reference.code)];
        }).map(function(reference) {
          return reference.code + ' — ' + reference.title;
        });
        return labels.length ? labels.join(', ') : selected.join(', ');
       },
      formatResearchDate: function(value) {
       if (!value) return '';
       var date = new Date(value);
       if (isNaN(date.getTime())) return value;
       return date.toLocaleDateString('en-GB', {day: 'numeric', month: 'long', year: 'numeric'});
     },
     updateResearchTimestamp: function() {
       if (this.researchProfile) this.$set(this.researchProfile, 'updatedAt', new Date().toISOString());
     },
    nextResearchCode: function(records, prefix) {
      var highest = 0;
      (records || []).forEach(function(record) {
        var match = String(record.code || '').toUpperCase().match(new RegExp('^' + prefix + '\\s*(\\d+)$'));
        if (match) highest = Math.max(highest, Number(match[1]));
      });
      return prefix + (highest + 1);
    },
     researchMapping: function(plo) {
       var id = plo.ploId || plo.code;
       if (!this.researchMappings[id]) this.$set(this.researchMappings, id, {ploId: plo.ploId, sdgIds: [], scIds: [], tfIds: [], derivedTFIds: [], mappingNote: ''});
       var mapping = this.researchMappings[id];
       var compatible = this.researchTFOptions(plo).filter(function(reference) { return this.isResearchTFCompatible(plo, reference); }.bind(this));
       var selected = (mapping.tfIds || [])[0];
       if (compatible.length && compatible.every(function(reference) { return reference.code !== selected; })) {
         this.$set(mapping, 'tfIds', [compatible[0].code]);
         this.$set(mapping, 'derivedTFIds', [compatible[0].code]);
       }
       return mapping;
     },
     researchTFOptions: function(plo) {
       return this.researchReferences.TF || [];
     },
     isResearchTFCompatible: function(plo, reference) {
       var domains = Array.isArray(plo.mqfDomains) ? plo.mqfDomains : [];
       return Array.isArray(reference.mqfDomains) && reference.mqfDomains.some(function(domain) { return domains.indexOf(domain) !== -1; });
     },
     researchSCOptions: function(category) {
       var codes = category && category.codes || [];
       return (this.researchReferences.SC || []).filter(function(reference) { return codes.indexOf(reference.code) !== -1; });
     },
    addResearchPEO: function() {
      this.researchPEOs.push({code: this.nextResearchCode(this.researchPEOs, 'PEO'), statement: ''});
      this.markResearchDirty();
    },
     addResearchPLO: function() {
       this.researchPLOs.push({code: this.nextResearchCode(this.researchPLOs, 'PLO'), parentPEO: '', statement: '', mqfDomains: [], taxonomy: ''});
       this.markResearchDirty();
     },
     removeResearchPLO: function(index) {
       this.researchPLOs.splice(index, 1);
       this.markResearchDirty();
     },
    setResearchPLOMQF: function(plo, domain) {
      this.$set(plo, 'mqfDomains', domain ? [domain] : []);
      this.markResearchDirty();
    },
    loadProgrammes: function() {
      this.loading = true;
      var self = this;
      google.script.run
        .withSuccessHandler(function(result) {
           self.programmes = (result || []).filter(function(programme) {
             var mode = String(programme.mode || '').trim().toLowerCase();
             if (mode) return mode === 'research' || mode === 'postgraduate by research';
             return !!(programme.researchDetail);
           });
          self.loading = false;
        })
        .withFailureHandler(function(err) {
          self.error = err.message;
          self.loading = false;
        })
        .getProgrammesApi();
    },
     loadDashboard: function() {
       var self = this;
       if (this.dashboardLoadingTimer) clearInterval(this.dashboardLoadingTimer);
       this.dashboardLoading = true;
       this.dashboardLoadingProgress = 12;
       this.dashboardLoadingStatus = 'Checking your access...';
       this.dashboardError = null;
       var stages = ['Loading programme records...', 'Calculating faculty readiness...', 'Preparing dashboard summary...'];
       var stage = 0;
       this.dashboardLoadingTimer = setInterval(function() {
         if (self.dashboardLoadingProgress < 86) self.dashboardLoadingProgress += 7;
         self.dashboardLoadingStatus = stages[Math.min(stage++, stages.length - 1)];
       }, 350);
       google.script.run
         .withSuccessHandler(function(result) { clearInterval(self.dashboardLoadingTimer); self.dashboardLoadingProgress = 100; self.dashboardLoadingStatus = 'Dashboard ready.'; self.dashboard = result; setTimeout(function() { self.dashboardLoading = false; }, 250); })
         .withFailureHandler(function(err) { clearInterval(self.dashboardLoadingTimer); self.dashboardError = err.message; self.dashboardLoading = false; })
         .getUniversityDashboardApi();
       if (this.user.role === 'Admin') {
         google.script.run.withSuccessHandler(function(items) { self.facultyUserDirectory = items || []; }).withFailureHandler(function(err) { self.showToast('User directory: ' + err.message); }).getFacultyUserDirectoryApi();
       }
     },
     phase1Percent: function(faculty) {
       if (!faculty || !faculty.programmeCount) return 0;
       return Math.round(((faculty.phase1CompleteCount || 0) / faculty.programmeCount) * 100);
     },
     facultyDisplayName: function(faculty) {
       var fullName = String(faculty && (faculty.facultyFull || faculty.faculty) || '').trim();
       var code = String(faculty && faculty.faculty || '').trim();
       if (code) fullName = fullName.replace(new RegExp('\\s*\\(' + code.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\$&') + '\\)\\s*$'), '');
       return fullName || code;
     },
     phase2Percent: function(faculty) {
       if (!faculty || !faculty.phase2TotalItems) return 0;
       return Math.round(((faculty.phase2CompletedItems || 0) / faculty.phase2TotalItems) * 100);
     },
     completionPercent: function(faculty) {
       return Math.round((this.phase1Percent(faculty) + this.phase2Percent(faculty)) / 2);
     },
     statusTone: function(status) {
       var value = String(status || '').toLowerCase();
       if (value === 'complete' || value === 'ready' || value === 'submitted') return 'state-good';
       if (value === 'blocked' || value === 'overdue') return 'state-bad';
       return 'state-warn';
     },
     toggleFaculty: function(faculty) {
       if (this.user.role !== 'Admin') {
         this.showToast('Only accessible by admin');
         return;
       }
       if (this.expandedFaculty === faculty) {
         this.expandedFaculty = '';
         return;
       }
       this.expandedFaculty = faculty;
       if (this.facultyDetails[faculty] || this.facultyDetailsLoading[faculty]) return;
       var self = this;
       this.$set(this.facultyDetailsLoading, faculty, true);
       this.$set(this.facultyDetailsError, faculty, '');
       google.script.run
         .withSuccessHandler(function(result) {
           self.$set(self.facultyDetails, faculty, result);
           self.$set(self.facultyDetailsLoading, faculty, false);
         })
         .withFailureHandler(function(err) {
           self.$set(self.facultyDetailsError, faculty, err.message || 'Unable to load faculty details.');
           self.$set(self.facultyDetailsLoading, faculty, false);
         })
         .getFacultyReportApi(faculty);
     },
     openFaculty: function(faculty) {
      if (this.user.role !== 'Admin') {
         this.showToast('Only accessible by admin');
        return;
      }
      this.selectedFaculty = faculty;
      this.search = '';
      this.setView('programmes');
    },
    loadAccessRequests: function() {
      var self = this;
      google.script.run.withSuccessHandler(function(items) { if (self.user.role === 'Admin') self.accessRequests = items; else self.myAccessRequests = items; }).withFailureHandler(function(err) { self.showToast('Access requests: ' + err.message); }).getAccessRequestsApi({});
    },
    createAccessRequest: function() {
      var self = this;
      if (!this.accessRequest.mqaCode || !this.accessRequest.reason) { this.showToast('Add a valid research MQA code and a reason for the request.'); return; }
      google.script.run.withSuccessHandler(function() { self.accessRequest = { targetFaculty: '', mqaCode: '', reason: '', scope: 'programme' }; self.showToast('Access request sent to Graduate School.'); self.loadAccessRequests(); }).withFailureHandler(function(err) { self.showToast(err.message); }).createAccessRequestApi(this.accessRequest);
    },
    decideAccess: function(request, decision) {
      var self = this;
      google.script.run.withSuccessHandler(function() { self.showToast('Access request ' + decision.toLowerCase() + '.'); self.loadAccessRequests(); }).withFailureHandler(function(err) { self.showToast(err.message); }).decideAccessRequestApi(request.requestId, decision, '');
    },
    revokeAccess: function(request) {
      var self = this;
      if (!confirm('Revoke this temporary access grant?')) return;
      google.script.run.withSuccessHandler(function() { self.loadAccessRequests(); }).withFailureHandler(function(err) { self.showToast(err.message); }).revokeAccessGrantApi(request.requestId, 'Revoked by Graduate School administrator');
    },
    loadGovernanceItems: function() {
      var self = this;
      if (this.user.role !== 'Admin') return;
      google.script.run.withSuccessHandler(function(items) { self.governanceItems = items; }).withFailureHandler(function(err) { self.showToast('Governance: ' + err.message); }).getGovernanceItemsApi({});
    },
      openProgramme: function(prog) {
        if (this.researchDirty && !confirm('You have unsaved changes. Leave this programme without saving?')) return;
        if (!this.isResearchProgramme(prog)) {
          this.showToast('This programme is not Postgraduate by Research and cannot open the research workspace.');
          return;
        }
        this.researchProfile = null;
        this.researchPEOs = [];
        this.researchPLOs = [];
        this.researchMappings = {};
        this.researchReferences = {MQF: [], TF: [], SDG: [], SC: []};
        this.researchCoverage = null;
        this.researchReview = null;
        this.researchStatus = 'Draft';
        this.researchLoading = false;
        this.researchError = null;
        this.researchWorkspaceFatalError = null;
        this.researchEndpointErrors = {profile: null, peos: null, plos: null, references: null, mappings: null, coverage: null, review: null};
        this.researchEndpointLoading = {profile: false, peos: false, plos: false, references: false, mappings: false, coverage: false, review: false};
        this.currentProgramme = prog;
       this.currentView = 'detail';
       this.researchCategory = 'information';
       this.researchDirty = false;
       this.assessmentDirty = false;
       this.assessmentMapping = null;
       this.assessmentReview = null;
       this.assessmentWorkspaceFatalError = null;
       this.assessmentEndpointErrors = {mapping: null, review: null};
       this.assessmentEndpointLoading = {mapping: false, review: false};
       this.assessmentPage = 'progress';
       this.assessmentSaveState = 'clean';
      this.researchSaveState = 'clean';
      this.dirty = false;
      this.loadResearchWorkspace();
    },
    toggleSub: function(sub) {
      this.$set(this.subgroupOpen, sub.key, !this.subgroupOpen[sub.key]);
    },
    setView: function(view) {
      if (this.researchDirty && view !== 'detail' && !confirm('You have unsaved changes. Leave without saving?')) return;
      this.currentView = view;
      this.researchDirty = false;
      this.dirty = false;
      if (view === 'dashboard') this.loadDashboard();
      if (view === 'programmes') this.loadProgrammes();
    },
     researchProgrammeIdentity: function(programme) {
       return String(programme && (programme.programmeId || programme.mqaCode) || '').trim();
     },
     isCurrentResearchRead: function(token) {
       return !!(token && token.generation === this.researchLoadGeneration && this.currentProgramme &&
         token.programmeId === this.researchProgrammeIdentity(this.currentProgramme));
     },
     researchEndpointLabel: function(endpoint) {
       var labels = {profile: 'Programme profile', peos: 'PEO records', plos: 'PLO records', references: 'Reference data', mappings: 'PLO mappings', coverage: 'Coverage', review: 'Research review', mapping: 'Assessment mapping', assessmentReview: 'Assessment review', assessment: 'Assessment workspace'};
       return labels[endpoint] || endpoint;
     },
     applyResearchEndpointResult: function(endpoint, envelope, token, kind) {
       if (!this.isCurrentResearchRead(token)) return false;
       var assessment = kind === 'assessment';
       var names = assessment ? this.assessmentEndpointNames : this.researchEndpointNames;
       if (names.indexOf(endpoint) === -1) return false;
       var errors = assessment ? this.assessmentEndpointErrors : this.researchEndpointErrors;
       var loading = assessment ? this.assessmentEndpointLoading : this.researchEndpointLoading;
       if (envelope && envelope.ok) {
         var value = envelope.data;
         if (assessment) {
           if (endpoint === 'mapping') this.assessmentMapping = value || [];
           if (endpoint === 'review') this.assessmentReview = value || null;
         } else if (endpoint === 'profile') {
           this.researchProfile = value || null;
         } else if (endpoint === 'peos') {
           this.researchPEOs = value || [];
         } else if (endpoint === 'plos') {
           this.researchPLOs = value || [];
         } else if (endpoint === 'references') {
           this.researchReferences = value || this.researchReferences;
         } else if (endpoint === 'mappings') {
           this.researchMappings = {};
           var self = this;
           (value || []).forEach(function(mapping) {
             var normalized = Object.assign({}, mapping);
             normalized.sdgIds = (Array.isArray(mapping.sdgIds) ? mapping.sdgIds : []).slice(0, 1);
             normalized.scIds = (Array.isArray(mapping.scIds) ? mapping.scIds : []).slice(0, 1);
             normalized.tfIds = (Array.isArray(mapping.tfIds) ? mapping.tfIds : (Array.isArray(mapping.derivedTFIds) ? mapping.derivedTFIds : [])).slice(0, 1);
             normalized.derivedTFIds = normalized.tfIds.slice(0, 1);
             self.$set(self.researchMappings, mapping.ploId, normalized);
           });
         } else if (endpoint === 'coverage') {
           this.researchCoverage = value || null;
         } else if (endpoint === 'review') {
           this.researchReview = value || null;
           if (value && value.status) this.researchStatus = value.status;
         }
         this.$set(loading, endpoint, false);
         this.$set(errors, endpoint, null);
         return true;
       }
        var sourceError = envelope && envelope.error || {};
        var clientError = {
          endpoint: sourceError.endpoint || (assessment ? 'assessment/' + endpoint : endpoint),
          code: sourceError.code || (assessment ? 'ASSESSMENT_' : 'RESEARCH_') + String(endpoint).toUpperCase() + '_FAILED',
          message: sourceError.message || 'Unable to load the ' + this.researchEndpointLabel(endpoint).toLowerCase() + '.',
         retryable: !!((envelope && envelope.retryable) || sourceError.retryable)
       };
       this.$set(loading, endpoint, false);
        this.$set(errors, endpoint, clientError);
        if (typeof console !== 'undefined' && console.error) {
          console.error('[ResearchWorkspaceClient] endpoint=' + clientError.endpoint + ' code=' + clientError.code + ' message=' + clientError.message);
        }
       return false;
     },
     loadResearchWorkspace: function() {
       var self = this;
       if (!this.currentProgramme) return;
       var programmeId = this.researchProgrammeIdentity(this.currentProgramme);
       var token = {generation: ++this.researchLoadGeneration, programmeId: programmeId};
       this.researchLoadProgrammeId = programmeId;
       this.researchLoading = true;
       this.researchError = null;
       this.researchWorkspaceFatalError = null;
       this.researchSaveState = 'loading';
       this.researchEndpointNames.forEach(function(endpoint) {
         self.$set(self.researchEndpointLoading, endpoint, true);
         self.$set(self.researchEndpointErrors, endpoint, null);
       });
       google.script.run
         .withSuccessHandler(function(result) {
           if (!self.isCurrentResearchRead(token)) return;
           self.researchLoading = false;
           if (!result || result.ok !== true || !result.endpoints) {
             self.researchWorkspaceFatalError = 'Unable to load the research workspace. Please try again.';
             self.researchSaveState = 'error';
             self.researchEndpointNames.forEach(function(endpoint) { self.$set(self.researchEndpointLoading, endpoint, false); });
             self.showToast(self.researchWorkspaceFatalError);
             return;
           }
           self.researchEndpointNames.forEach(function(endpoint) {
             self.applyResearchEndpointResult(endpoint, result.endpoints[endpoint], token, 'research');
           });
           self.researchSaveState = self.researchEndpointNames.some(function(endpoint) { return !!self.researchEndpointErrors[endpoint]; }) ? 'error' : 'clean';
         })
         .withFailureHandler(function(error) {
           if (!self.isCurrentResearchRead(token)) return;
           var message = error && error.message ? error.message : 'Unable to load the research workspace. Please try again.';
           self.researchLoading = false;
           self.researchWorkspaceFatalError = message;
           self.researchSaveState = 'error';
           self.researchEndpointNames.forEach(function(endpoint) { self.$set(self.researchEndpointLoading, endpoint, false); });
           if (typeof console !== 'undefined' && console.error) console.error('[ResearchWorkspaceClient] endpoint=workspace code=RESEARCH_WORKSPACE_FAILED message=' + message);
           self.showToast(message);
         })
         .getResearchWorkspaceApi(programmeId);
     },
     retryResearchEndpoint: function(endpoint) {
       var self = this;
       endpoint = String(endpoint || '').trim();
       if (this.researchEndpointNames.indexOf(endpoint) === -1) {
         var unknown = {endpoint: endpoint, code: 'CLIENT_UNKNOWN_RESEARCH_ENDPOINT', message: 'Unknown research endpoint.', retryable: false};
         this.$set(this.researchEndpointErrors, endpoint, unknown);
         if (typeof console !== 'undefined' && console.error) console.error('[ResearchWorkspaceClient] endpoint=' + endpoint + ' code=' + unknown.code + ' message=' + unknown.message);
         return;
       }
       if (!this.currentProgramme) return;
       var programmeId = this.researchProgrammeIdentity(this.currentProgramme);
       var token = {generation: this.researchLoadGeneration, programmeId: programmeId};
       this.$set(this.researchEndpointLoading, endpoint, true);
       this.$set(this.researchEndpointErrors, endpoint, null);
       var runner = google.script.run.withSuccessHandler(function(result) {
         self.applyResearchEndpointResult(endpoint, {ok: true, data: result}, token, 'research');
       }).withFailureHandler(function(error) {
         self.applyResearchEndpointResult(endpoint, {ok: false, error: {code: error && error.code, message: error && error.message, retryable: !!(error && error.retryable)}, retryable: !!(error && error.retryable)}, token, 'research');
       });
       if (endpoint === 'profile') runner.getResearchProgrammeApi(programmeId);
       else if (endpoint === 'peos') runner.getResearchPEOsApi(programmeId);
       else if (endpoint === 'plos') runner.getResearchPLOsApi(programmeId);
       else if (endpoint === 'references') runner.getResearchReferencesApi();
       else if (endpoint === 'mappings') runner.getResearchMappingsApi(programmeId);
       else if (endpoint === 'coverage') runner.getResearchCoverageApi(programmeId);
       else if (endpoint === 'review') runner.getResearchReviewApi(programmeId);
     },
     researchFailure: function(error) {
       this.researchError = error && error.message ? error.message : 'The research workspace request failed.';
       this.researchSaveState = 'error';
       this.researchDirty = true;
       this.dirty = true;
       this.showToast(this.researchError);
    },
    refreshResearchDerived: function() {
      this.loadResearchMappings();
      this.loadResearchCoverage();
      this.loadResearchReview();
    },
     loadResearchMappings: function() {
       this.retryResearchEndpoint('mappings');
    },
    saveResearchProfile: function() {
      var self = this; this.researchSaveState = 'saving'; this.researchError = null;
       google.script.run.withSuccessHandler(function(profile) { self.researchProfile = profile; self.researchMutationComplete('Programme profile saved.'); }).withFailureHandler(function(e) { self.researchFailure(e); }).saveResearchProfileApi(this.currentProgramme.programmeId || this.currentProgramme.mqaCode, this.researchProfile);
    },
    saveResearchPEOs: function() {
      var self = this; this.researchSaveState = 'saving'; this.researchError = null;
       google.script.run.withSuccessHandler(function(peos) { self.researchPEOs = peos || []; self.updateResearchTimestamp(); self.researchMutationComplete('PEO records saved.'); }).withFailureHandler(function(e) { self.researchFailure(e); }).saveResearchPEOsApi(this.currentProgramme.programmeId || this.currentProgramme.mqaCode, this.researchPEOs);
    },
    saveResearchPLOs: function() {
      var self = this; this.researchSaveState = 'saving'; this.researchError = null;
      var ploPayload = this.researchPLOs.map(function(plo) {
        return { ploId: plo.ploId, code: plo.code, parentPEO: plo.parentPEO, statement: plo.statement,
           mqfDomains: plo.mqfDomains, taxonomy: plo.taxonomy };
      });
       google.script.run.withSuccessHandler(function(plos) {
         self.researchPLOs = plos || [];
         self.updateResearchTimestamp();
         self.researchMutationComplete('PLO records saved.');
       }).withFailureHandler(function(e) { self.researchFailure(e); }).saveResearchPLOsApi(this.currentProgramme.programmeId || this.currentProgramme.mqaCode, ploPayload);
    },
    saveResearchPLOMapping: function(plo) {
      var self = this;
      var mapping = this.researchMapping(plo);
      var ploPayload = this.researchPLOs.map(function(item) {
        return { ploId: item.ploId, code: item.code, parentPEO: item.parentPEO, statement: item.statement,
           mqfDomains: item.mqfDomains, taxonomy: item.taxonomy };
      });
      this.researchSaveState = 'saving';
      this.researchError = null;
       google.script.run.withSuccessHandler(function(savedPLOs) {
         self.researchPLOs = savedPLOs || [];
         self.updateResearchTimestamp();
         var savedPLO = self.researchPLOs.filter(function(item) { return item.code === plo.code; })[0];
        if (!savedPLO || !savedPLO.ploId) {
          self.researchFailure({message: 'The PLO was not persisted, so its mapping was not saved.'});
          return;
        }
         var mappingPayload = {
           sdgIds: mapping.sdgIds || [],
           scIds: mapping.scIds || [],
           tfIds: mapping.tfIds || [],
           mappingNote: mapping.mappingNote || ''
        };
        google.script.run.withSuccessHandler(function(saved) {
          self.$set(self.researchMappings, savedPLO.ploId, saved);
          self.researchMutationComplete('PLO fields and mapping saved.');
         }).withFailureHandler(function(e) { self.researchFailure(e); }).saveResearchPLOMappingApi(self.currentProgramme.programmeId || self.currentProgramme.mqaCode, savedPLO.ploId, mappingPayload);
       }).withFailureHandler(function(e) { self.researchFailure(e); }).saveResearchPLOsApi(this.currentProgramme.programmeId || this.currentProgramme.mqaCode, ploPayload);
    },
    researchMutationComplete: function(message) {
      this.researchDirty = false; this.dirty = false; this.researchSaveState = 'saved'; this.researchError = null; this.showToast(message); this.refreshResearchDerived();
    },
     loadResearchCoverage: function() {
       this.retryResearchEndpoint('coverage');
     },
      loadResearchReview: function() {
       this.retryResearchEndpoint('review');
       },
      loadAssessmentWorkspace: function() {
        var self = this; if (!this.currentProgramme) return;
        var programmeId = this.researchProgrammeIdentity(this.currentProgramme);
        var token = {generation: this.researchLoadGeneration, programmeId: programmeId};
        this.assessmentWorkspaceFatalError = null;
        this.assessmentSaveState = 'loading';
        this.assessmentEndpointNames.forEach(function(endpoint) {
          self.$set(self.assessmentEndpointLoading, endpoint, true);
          self.$set(self.assessmentEndpointErrors, endpoint, null);
        });
        google.script.run
          .withSuccessHandler(function(result) {
            if (!self.isCurrentResearchRead(token)) return;
            if (!result || result.ok !== true || !result.endpoints) {
              self.assessmentWorkspaceFatalError = 'Unable to load the assessment workspace. Please try again.';
              self.assessmentSaveState = 'error';
              self.assessmentEndpointNames.forEach(function(endpoint) { self.$set(self.assessmentEndpointLoading, endpoint, false); });
              return;
            }
            self.assessmentEndpointNames.forEach(function(endpoint) {
              self.applyResearchEndpointResult(endpoint, result.endpoints[endpoint], token, 'assessment');
            });
            self.assessmentSaveState = self.assessmentEndpointNames.some(function(endpoint) { return !!self.assessmentEndpointErrors[endpoint]; }) ? 'error' : 'clean';
          })
          .withFailureHandler(function(error) {
            if (!self.isCurrentResearchRead(token)) return;
            var message = error && error.message ? error.message : 'Unable to load the assessment workspace. Please try again.';
            self.assessmentWorkspaceFatalError = message;
            self.assessmentSaveState = 'error';
            self.assessmentEndpointNames.forEach(function(endpoint) { self.$set(self.assessmentEndpointLoading, endpoint, false); });
            if (typeof console !== 'undefined' && console.error) console.error('[ResearchWorkspaceClient] endpoint=assessment code=ASSESSMENT_WORKSPACE_FAILED message=' + message);
          })
          .getAssessmentWorkspaceApi(programmeId);
      },
      loadAssessmentMapping: function() {
        if (!this.assessmentMapping || !this.assessmentReview) this.loadAssessmentWorkspace();
      },
      retryAssessmentEndpoint: function(endpoint) {
        var self = this;
        endpoint = String(endpoint || '').trim();
        if (this.assessmentEndpointNames.indexOf(endpoint) === -1) {
          var unknown = {endpoint: endpoint, code: 'CLIENT_UNKNOWN_ASSESSMENT_ENDPOINT', message: 'Unknown assessment endpoint.', retryable: false};
          this.$set(this.assessmentEndpointErrors, endpoint, unknown);
          if (typeof console !== 'undefined' && console.error) console.error('[ResearchWorkspaceClient] endpoint=' + endpoint + ' code=' + unknown.code + ' message=' + unknown.message);
          return;
        }
        if (!this.currentProgramme) return;
        var programmeId = this.researchProgrammeIdentity(this.currentProgramme);
        var token = {generation: this.researchLoadGeneration, programmeId: programmeId};
        this.$set(this.assessmentEndpointLoading, endpoint, true);
        this.$set(this.assessmentEndpointErrors, endpoint, null);
        var runner = google.script.run.withSuccessHandler(function(result) {
          self.applyResearchEndpointResult(endpoint, {ok: true, data: result}, token, 'assessment');
        }).withFailureHandler(function(error) {
          self.applyResearchEndpointResult(endpoint, {ok: false, error: {code: error && error.code, message: error && error.message, retryable: !!(error && error.retryable)}, retryable: !!(error && error.retryable)}, token, 'assessment');
        });
        if (endpoint === 'mapping') runner.getAssessmentMappingApi(programmeId);
        else if (endpoint === 'review') runner.getAssessmentReviewApi(programmeId);
      },
      loadAssessmentReview: function() {
        this.retryAssessmentEndpoint('review');
      },
     handleAssessmentPageKeydown: function(event) {
       var pages = ['progress', 'viva', 'thesis'];
       var index = pages.indexOf(this.assessmentPage);
       if (event.key === 'ArrowRight') index = (index + 1) % pages.length;
       else if (event.key === 'ArrowLeft') index = (index + pages.length - 1) % pages.length;
       else if (event.key === 'Home') index = 0;
       else if (event.key === 'End') index = pages.length - 1;
       else return;
       event.preventDefault();
       this.assessmentPage = pages[index];
       this.$nextTick(function() {
         var tab = document.getElementById('assessment-' + pages[index] + '-tab');
         if (tab) tab.focus();
       });
     },
     assessmentItems: function() {
       return (this.assessmentMapping || []).reduce(function(items, instrument) { return items.concat(instrument.items || []); }, []);
     },
     saveAssessmentMapping: function() {
       var self = this; if (!this.currentProgramme) return;
       this.assessmentSaveState = 'saving'; this.researchError = null;
       var payload = {items: this.assessmentItems().map(function(item) { return {itemId: item.itemId, mqfDomains: item.effective.mqfDomains, taxonomy: item.effective.taxonomy, primarySC: item.effective.primarySC, note: item.note || ''}; })};
       google.script.run.withSuccessHandler(function(mapping) { self.assessmentMapping = mapping || []; self.assessmentDirty = false; self.researchDirty = false; self.dirty = false; self.assessmentSaveState = 'saved'; self.loadAssessmentReview(); self.showToast('Assessment alignment saved.'); }).withFailureHandler(function(e) { self.assessmentSaveState = 'error'; self.researchFailure(e); }).saveAssessmentMappingApi(this.currentProgramme.programmeId || this.currentProgramme.mqaCode, payload);
     },
     resetAssessmentMapping: function() {
       var self = this; if (!this.currentProgramme || !confirm('Reset assessment alignment to PPS defaults?')) return;
       this.assessmentSaveState = 'saving';
       google.script.run.withSuccessHandler(function(mapping) { self.assessmentMapping = mapping || []; self.assessmentDirty = false; self.researchDirty = false; self.dirty = false; self.assessmentSaveState = 'saved'; self.loadAssessmentReview(); self.showToast('Assessment alignment reset to PPS defaults.'); }).withFailureHandler(function(e) { self.assessmentSaveState = 'error'; self.researchFailure(e); }).resetAssessmentMappingApi(this.currentProgramme.programmeId || this.currentProgramme.mqaCode, []);
     },
     submitResearchProgramme: function() {
       var self = this;
       google.script.run.withSuccessHandler(function(result) { self.researchStatus = result.status; self.researchMutationComplete('Programme submitted for review.'); }).withFailureHandler(function(e) { self.researchFailure(e); }).submitResearchProgrammeApi(this.currentProgramme.programmeId || this.currentProgramme.mqaCode);
    },
    selectAllMQFDomains: function(plo) {
      plo.mqfDomains = this.researchReferences.MQF.map(function(domain) { return domain.code; }); this.markResearchDirty();
    },
    handleResearchCategoryKeydown: function(event) {
       var categories = ['information', 'mapping', 'assessment'];
      var currentIndex = categories.indexOf(this.researchCategory);
      var nextIndex = currentIndex;
      if (event.key === 'ArrowRight') nextIndex = (currentIndex + 1) % categories.length;
      else if (event.key === 'ArrowLeft') nextIndex = (currentIndex + categories.length - 1) % categories.length;
      else if (event.key === 'Home') nextIndex = 0;
      else if (event.key === 'End') nextIndex = categories.length - 1;
      else return;

      event.preventDefault();
      var category = categories[nextIndex];
      this.researchCategory = category;
      this.$nextTick(function() {
        var tab = document.getElementById('research-' + category + '-tab');
        if (tab) tab.focus();
      });
    },
     setSingleResearchReference: function(plo, key, code) {
       var mapping = this.researchMapping(plo);
       this.$set(mapping, key, code ? [code] : []);
       if (key === 'tfIds') this.$set(mapping, 'derivedTFIds', code ? [code] : []);
       this.markResearchDirty();
     },
    leaveResearchWorkspace: function() { this.setView('programmes'); },
    loadPendingDeletions: function() {
      var self = this;
      if (this.user.role !== 'Admin') return;
      google.script.run
        .withSuccessHandler(function(r) { self.pendingDeletions = r; })
        .getPendingDeletionsApi();
    },
    prepareSheets: function() {
      this.preparing = true;
      var self = this;
      google.script.run
        .withSuccessHandler(function(result) {
          self.preparing = false;
          self.showToast('Created: ' + result.created.length + ' tabs. Skipped: ' + result.skipped.length + (result.errors.length ? ' Errors: ' + result.errors.join(', ') : ''));
        })
        .withFailureHandler(function(e) {
          self.preparing = false;
          self.showToast('Error: ' + e.message);
        })
        .prepareAllSheetsApi();
    },
    approveDelete: function(requestId) {
      var self = this;
      google.script.run
        .withSuccessHandler(function() { self.loadPendingDeletions(); })
        .approveDeleteFileApi(requestId);
    }
  },
     mounted: function() {
    this.loadDashboard();
    this.loadProgrammes();
    this.loadPendingDeletions();
    this.loadAccessRequests();
    this.loadGovernanceItems();
  },
   watch: {
      researchCategory: function(category) {
        if (category === 'mapping' && this.currentProgramme) {
         this.loadResearchCoverage();
         this.loadResearchReview();
        }
         if (category === 'assessment' && this.currentProgramme && (!this.assessmentMapping || !this.assessmentReview)) {
           if (!this.assessmentMapping && !this.assessmentReview) this.loadAssessmentMapping();
           else if (!this.assessmentReview) this.loadAssessmentReview();
         }
     }
  }
});
}
