<script>
  /* Shared client for both pages. BOOT is injected by Index.html (server side). */
  var BOOT = window.BOOT || {};

  function emptyDetail() {
    return { name: '', mqaCode: '', progCode: '', level: '', faculty: '', facultyFull: '', peos: [], plos: [] };
  }

  function emptyPdf() {
    return { open: false, generating: false, ready: false, error: null, filename: '', url: '', fileId: '', email: '', emailForm: false, sending: false, sent: false };
  }

  function initApp() {
    new Vue({
      el: '#app',
      data: {
        page: BOOT.page || 'programmes',
        lang: 'en',
        currentUser: BOOT.user || null,
        sessionToken: BOOT.token || '',
        baseUrl: BOOT.baseUrl || '',
        programmes: BOOT.programmes || [],
        pdfLog: BOOT.pdfLog || [],
        canManageReview: !!BOOT.canManageReview,
        summary: BOOT.reviewSummary || null,
        sdg: BOOT.sdg || { totalProgrammes: 0, mappedPlos: 0, sdgs: [] },
        sdgDetail: null,
        maps: BOOT.maps || null,
        mapTab: 'sdg',
        mapDetail: null,
        changes: BOOT.changes || [],
        changeOpen: false,
        changeSaving: false,
        changeError: null,
        changeForm: { nameMy: '', name: '', progCode: '', nec: '', accreditation: '', mode: '' },
        schoolModal: false,
        sections: { peo: true, plo: true, pdf: true },
        review: Object.assign({
          open: true, active: null, canSubmit: false, currentText: '',
          history: [], missingLabel: 'Tidak dikemaskini',
          draft: '', submitting: false, error: null, notice: null
        }, BOOT.review || {}),
        detail: Object.assign(emptyDetail(), BOOT.detail || {}),
        search: '',
        open: {},
        loading: false,
        error: null,
        notice: null,
        detailError: null,
        saving: false,
        editError: null,
        adding: false,
        pdf: emptyPdf(),
        editor: { open: false, type: '', draft: {} },
          mqfDomains: [
            { code: 'MQF 1', label: 'MQF1 — Knowledge and Understanding' },
            { code: 'MQF 2', label: 'MQF2 — Cognitive Skills' },
            { code: 'MQF 3a', label: 'MQF3a — Practical Skills' },
            { code: 'MQF 3b', label: 'MQF3b — Interpersonal Skills' },
            { code: 'MQF 3c', label: 'MQF3c — Communication Skills' },
            { code: 'MQF 3d', label: 'MQF3d — Digital Skills' },
            { code: 'MQF 3e', label: 'MQF3e — Numeracy Skills' },
            { code: 'MQF 3f', label: 'MQF3f — Leadership, Autonomy and Responsibility' },
            { code: 'MQF 4a', label: 'MQF4a — Personal Skills' },
            { code: 'MQF 4b', label: 'MQF4b — Entrepreneurial Skills' },
            { code: 'MQF 5', label: 'MQF5 — Ethics and Professionalism' }
          ],
          taxonomyGroups: [
            { label: 'C — Cognitive', levels: [{ code: 'C1', label: 'Remember' }, { code: 'C2', label: 'Understand' }, { code: 'C3', label: 'Apply' }, { code: 'C4', label: 'Analyse' }, { code: 'C5', label: 'Evaluate' }, { code: 'C6', label: 'Create' }] },
            { label: 'A — Affective', levels: [{ code: 'A1', label: 'Receive' }, { code: 'A2', label: 'Respond' }, { code: 'A3', label: 'Value' }, { code: 'A4', label: 'Organise' }, { code: 'A5', label: 'Characterise' }] },
            { label: 'P — Psychomotor', levels: [{ code: 'P1', label: 'Imitation' }, { code: 'P2', label: 'Manipulation' }, { code: 'P3', label: 'Precision' }, { code: 'P4', label: 'Articulation' }, { code: 'P5', label: 'Naturalisation' }] }
          ],
          sdgs: [
            { code: 'SDG1', label: 'No Poverty' }, { code: 'SDG2', label: 'Zero Hunger' }, { code: 'SDG3', label: 'Good Health and Well-being' }, { code: 'SDG4', label: 'Quality Education' }, { code: 'SDG5', label: 'Gender Equality' }, { code: 'SDG6', label: 'Clean Water and Sanitation' }, { code: 'SDG7', label: 'Affordable and Clean Energy' }, { code: 'SDG8', label: 'Decent Work and Economic Growth' }, { code: 'SDG9', label: 'Industry, Innovation and Infrastructure' }, { code: 'SDG10', label: 'Reduced Inequalities' }, { code: 'SDG11', label: 'Sustainable Cities and Communities' }, { code: 'SDG12', label: 'Responsible Consumption and Production' }, { code: 'SDG13', label: 'Climate Action' }, { code: 'SDG14', label: 'Life Below Water' }, { code: 'SDG15', label: 'Life on Land' }, { code: 'SDG16', label: 'Peace, Justice and Strong Institutions' }, { code: 'SDG17', label: 'Partnerships for the Goals' }
          ],
          sustainabilityCompetencies: [
            { code: 'SC1', label: 'Systems Thinking', domain: 'thinking' },
            { code: 'SC2', label: 'Anticipatory (Future Thinking)', domain: 'thinking' },
            { code: 'SC3', label: 'Critical Thinking', domain: 'thinking' },
            { code: 'SC4', label: 'Strategic', domain: 'practicing' },
            { code: 'SC5', label: 'Collaboration', domain: 'practicing' },
            { code: 'SC6', label: 'Integrated Problem-solving', domain: 'practicing' },
            { code: 'SC7', label: 'Self-awareness', domain: 'being' },
            { code: 'SC8', label: 'Normative', domain: 'being' }
          ],
          transversalFutureSkills: [
            { code: 'TF1', label: 'Murabbi Unggul', mqfDomains: ['MQF1', 'MQF4A'] },
            { code: 'TF2', label: 'Gaya Hidup Sejahtera', mqfDomains: ['MQF2', 'MQF3D', 'MQF3E'] },
            { code: 'TF3', label: 'Hubungan Insaniah', mqfDomains: ['MQF3A', 'MQF3B', 'MQF3C', 'MQF3F'] },
            { code: 'TF4', label: "Ta'lim wa Tarbiyah", mqfDomains: ['MQF4B', 'MQF5'] }
          ]
      },
      computed: {
        isRtl: function () { return this.lang === 'ar'; },
        listUrl: function () {
          return this.baseUrl + '?page=programmes';
        },
        reviewUrl: function () {
          return this.baseUrl + '?page=review';
        },
        mapCards: function () {
          if (!this.maps) return [];
          var rows = this.maps[this.mapTab] || [];
          var byCode = {};
          rows.forEach(function (row) { byCode[row.code] = row; });
          var catalogue;
          if (this.mapTab === 'sdg') catalogue = this.sdgs;
          else if (this.mapTab === 'sc') catalogue = this.sustainabilityCompetencies;
          else catalogue = this.transversalFutureSkills;
          return (catalogue || []).map(function (item) {
            var row = byCode[item.code] || { programmeCount: 0, ploCount: 0, percent: 0, entries: [] };
            return {
              code: item.code,
              label: item.label,
              programmeCount: row.programmeCount,
              ploCount: row.ploCount,
              percent: row.percent || 0,
              entries: row.entries || []
            };
          });
        },
        sdgCards: function () {
          var byCode = {};
          (this.sdg.sdgs || []).forEach(function (row) { byCode[row.code] = row; });
          var max = 1;
          (this.sdg.sdgs || []).forEach(function (row) { max = Math.max(max, row.programmeCount); });
          var self = this;
          return (this.sdgs || []).map(function (goal) {
            var row = byCode[goal.code] || { programmeCount: 0, ploCount: 0, entries: [] };
            return {
              code: goal.code,
              label: goal.label,
              programmeCount: row.programmeCount,
              ploCount: row.ploCount,
              entries: row.entries || [],
              percent: Math.round((row.programmeCount / max) * 100)
            };
          });
        },
        filtered: function () {
          if (!this.search) return this.programmes;
          var q = this.search.toLowerCase();
          return this.programmes.filter(function (p) {
            return (p.name || '').toLowerCase().indexOf(q) > -1 ||
                   (p.nameMy || '').toLowerCase().indexOf(q) > -1 ||
                   (p.mqaCode || '').toLowerCase().indexOf(q) > -1 ||
                   (p.progCode || '').toLowerCase().indexOf(q) > -1 ||
                   (p.facultyFull || '').toLowerCase().indexOf(q) > -1;
          });
        },
        grouped: function () {
          var order = ['Doctorate', 'Masters', 'Other'];
          var map = {};
          this.filtered.forEach(function (p) {
            var level = order.indexOf(p.level) === -1 ? 'Other' : p.level;
            if (!map[level]) map[level] = {};
            if (!map[level][p.faculty]) map[level][p.faculty] = [];
            map[level][p.faculty].push(p);
          });

          return order.reduce(function (result, level) {
            if (!map[level]) return result;
            var facultyKeys = Object.keys(map[level]).sort();
            var faculties = facultyKeys.map(function (key) {
              var programmes = map[level][key].sort(function (a, b) {
                return (a.name || '').localeCompare(b.name || '');
              });
              var first = programmes[0] || {};
              return {
                title: first.facultyFull || key || 'Unknown',
                key: level + '::' + key,
                count: programmes.length,
                programmes: programmes
              };
            });
            var count = faculties.reduce(function (n, f) { return n + f.count; }, 0);
            result.push({ title: level, key: level, count: count, faculties: faculties });
            return result;
          }, []);
        },
        mappingSummary: function () {
          var self = this;
          var plos = this.detail.plos || [];
          var peos = this.detail.peos || [];
          var domainOf = { SC1: 'thinking', SC2: 'thinking', SC3: 'thinking',
            SC4: 'practicing', SC5: 'practicing', SC6: 'practicing', SC7: 'being', SC8: 'being' };
          var complete = 0;
          var scComplete = 0;
          var tfMapped = 0;
          var sdgEligible = 0;
          var sdgMapped = 0;
          plos.forEach(function (plo) {
            var codes = String(plo.sc || '').split(',').map(function (v) { return v.trim().toUpperCase(); }).filter(Boolean);
            var domains = {};
            codes.forEach(function (code) { if (domainOf[code]) domains[domainOf[code]] = true; });
            var hasSc = !!(domains.thinking && domains.practicing && domains.being);
            if (hasSc) scComplete++;
            if (plo.tf) tfMapped++;
            if (self.isSDGEligiblePLO(plo.code)) {
              sdgEligible++;
              if (plo.sdg) sdgMapped++;
            }
            var ok = !!(plo.statement && plo.parentPEO && plo.mqfDomain && plo.taxonomy && plo.tf && hasSc
              && (!self.isSDGEligiblePLO(plo.code) || plo.sdg));
            if (ok) complete++;
          });
          return {
            peoCount: peos.length,
            ploCount: plos.length,
            ploComplete: complete,
            scComplete: scComplete,
            tfMapped: tfMapped,
            sdgEligible: sdgEligible,
            sdgMapped: sdgMapped,
            percent: plos.length ? Math.round((complete / plos.length) * 100) : 0
          };
        },
        scByDomain: function () {
          var groups = { thinking: [], practicing: [], being: [] };
          this.sustainabilityCompetencies.forEach(function (item) { groups[item.domain].push(item); });
          return groups;
        },
        availableTFs: function () {
          // Teras FlexS are chosen freely by each faculty; no MQF-domain filter.
          return this.transversalFutureSkills;
        },
        userLabel: function () {
          if (!this.currentUser) return '';
          return this.currentUser.name + ' — ' + this.currentUser.faculty;
        }
      },
      methods: {
        t: function (key) {
          var table = MESSAGES[this.lang] || MESSAGES.ms;
          return Object.prototype.hasOwnProperty.call(table, key) ? table[key] : (MESSAGES.ms[key] || key);
        },
        setLang: function (code) {
          this.lang = ['ms', 'en', 'ar'].indexOf(code) === -1 ? 'ms' : code;
          try { localStorage.setItem('ggn-lang', this.lang); } catch (e) {}
          if (this.sessionToken) {
            google.script.run.withFailureHandler(function () {}).saveUserLanguageApi(this.lang, this.sessionToken);
          }
        },
        detailUrl: function (programme) {
          return this.baseUrl + '?page=detail&mqaCode=' + encodeURIComponent(programme.mqaCode) +
            '&faculty=' + encodeURIComponent(programme.faculty || '');
        },
        toggleFaculty: function (faculty) {
          this.$set(this.open, faculty.key, !this.open[faculty.key]);
        },
        openOwnFaculty: function () {
          if (!this.currentUser || !this.currentUser.faculty) return;
          var self = this;
          this.grouped.forEach(function (level) {
            level.faculties.forEach(function (faculty) {
              var owns = faculty.programmes.some(function (p) { return p.faculty === self.currentUser.faculty; });
              if (owns) self.$set(self.open, faculty.key, true);
            });
          });
        },
        normalizeMQFDomain: function (value) {
          var compact = String(value || '').replace(/\s+/g, '').toUpperCase();
          for (var i = 0; i < this.mqfDomains.length; i++) {
            if (this.mqfDomains[i].code.replace(/\s+/g, '').toUpperCase() === compact) return this.mqfDomains[i].code;
          }
          return String(value || '').trim();
        },
        clearTF: function () {
          this.editor.draft.tf = '';
        },
        isSDGEligiblePLO: function (ploCode) {
          var programmeCode = String(this.detail.mqaCode || '').trim().toUpperCase();
          var eligible = (programmeCode === 'MQA/FA5573' || programmeCode === 'MQA/FA5574')
            ? ['PLO1', 'PLO9', 'PLO10']
            : ['PLO1', 'PLO9', 'PLO11'];
          return eligible.indexOf(String(ploCode || '').replace(/\s+/g, '').toUpperCase().replace(/^PLO0+(\d+)$/, 'PLO$1')) > -1;
        },
        isSCEligiblePLO: function () {
          // Sustainability competencies are chosen freely by each faculty.
          return true;
        },
        openEdit: function (type, record) {
          this.editError = null;
          this.editor = {
            open: true,
            type: type,
            draft: {
              code: record.code,
              statement: record.statement || '',
              parentPEO: record.parentPEO || '',
              mqfDomain: this.normalizeMQFDomain(record.mqfDomain),
              taxonomy: String(record.taxonomy || '').toUpperCase(),
              sdg: this.isSDGEligiblePLO(record.code) ? String(record.sdg || '').replace(/\s+/g, '').toUpperCase() : '',
              scThinking: '', scPracticing: '', scBeing: '',
              tf: String(record.tf || '').replace(/\s+/g, '').toUpperCase()
            }
          };
          this.loadScPicks(record);
        },
        loadScPicks: function (record) {
          var self = this;
          var picks = { thinking: '', practicing: '', being: '' };
          String(record.sc || '').split(',').forEach(function (code) {
            var upper = code.trim().toUpperCase();
            self.sustainabilityCompetencies.forEach(function (item) {
              if (item.code === upper) picks[item.domain] = upper;
            });
          });
          this.$set(this.editor.draft, 'scThinking', picks.thinking);
          this.$set(this.editor.draft, 'scPracticing', picks.practicing);
          this.$set(this.editor.draft, 'scBeing', picks.being);
        },
        closeEdit: function () {
          if (this.saving) return;
          this.editor = { open: false, type: '', draft: {} };
          this.editError = null;
        },
        applyDetail: function (result) {
          this.$set(this.detail, 'peos', result.peos || []);
          this.$set(this.detail, 'plos', result.plos || []);
          if (result.hasOwnCopy !== undefined) this.$set(this.detail, 'hasOwnCopy', result.hasOwnCopy);
          if (result.differsFromOwner !== undefined) this.$set(this.detail, 'differsFromOwner', result.differsFromOwner);
        },
        loadSummary: function () {
          var self = this;
          google.script.run
            .withSuccessHandler(function (payload) { if (payload) self.summary = payload; })
            .withFailureHandler(function () { /* dashboard is optional */ })
            .getReviewSummaryApi(this.sessionToken);
        },
        openChange: function () {
          var d = this.detail || {};
          this.changeForm = {
            nameMy: d.nameMy || '', name: d.name || '', progCode: d.progCode || '',
            nec: d.nec || '', accreditation: d.accreditation || '', mode: d.mode || 'Research'
          };
          this.changeError = null;
          this.changeOpen = true;
        },
        closeChange: function () {
          if (this.changeSaving) return;
          this.changeOpen = false;
        },
        submitChange: function () {
          var self = this;
          this.changeSaving = true;
          this.changeError = null;
          google.script.run
            .withSuccessHandler(function (result) {
              self.changeSaving = false;
              self.changeOpen = false;
              self.notice = 'Change sent for PPS approval.';
              if (result) self.changes = self.changes.concat([{ requestId: String(Date.now()), changes: {} }]);
            })
            .withFailureHandler(function (err) {
              self.changeSaving = false;
              self.changeError = err && err.message ? err.message : 'The change could not be sent.';
            })
            .submitProgrammeChangeApi(this.detail.mqaCode, this.changeForm, this.sessionToken, this.detail.faculty);
        },
        requestDelete: function () {
          var self = this;
          if (!window.confirm('Request deletion of this programme? A PPS approver must confirm before it is removed.')) return;
          google.script.run
            .withSuccessHandler(function (result) {
              self.notice = 'Deletion request sent for PPS approval.';
              if (result) self.changes = self.changes.concat([{ requestId: String(Date.now()), changes: { __action: 'delete' } }]);
            })
            .withFailureHandler(function (err) {
              self.detailError = err && err.message ? err.message : 'The request could not be sent.';
            })
            .submitProgrammeChangeApi(this.detail.mqaCode, { __action: 'delete' }, this.sessionToken, this.detail.faculty);
        },
        openMap: function (item) {
          this.mapDetail = item.programmeCount ? item : { code: item.code, label: item.label, programmeCount: 0, percent: 0, entries: [] };
        },
        openSdg: function (goal) {
          this.sdgDetail = goal.programmeCount ? goal : { code: goal.code, label: goal.label, programmeCount: 0, entries: [] };
        },
        submitReview: function () {
          var self = this;
          if (this.review.submitting || !this.review.draft) return;
          this.review.submitting = true;
          this.review.error = null;
          this.review.notice = null;
          google.script.run
            .withSuccessHandler(function (result) {
              self.review.submitting = false;
              self.applyReview(result || {});
              self.review.notice = 'Status semakan telah dihantar.';
            })
            .withFailureHandler(function (err) {
              self.review.submitting = false;
              self.review.error = err && err.message ? err.message : 'Status tidak dapat dihantar.';
            })
            .submitReviewStatusApi(this.detail.mqaCode, this.review.draft, this.sessionToken, this.detail.faculty);
        },
        applyReview: function (payload) {
          this.$set(this.review, 'active', payload.active || null);
          this.$set(this.review, 'canSubmit', !!payload.canSubmit);
          this.$set(this.review, 'currentText', payload.currentText || '');
          this.$set(this.review, 'inheritedFrom', payload.inheritedFrom || '');
          this.$set(this.review, 'history', payload.history || []);
        },
        addRecord: function (type) {
          var self = this;
          this.adding = true;
          this.detailError = null;
          google.script.run
            .withSuccessHandler(function (result) {
              self.applyDetail(result || {});
              self.notice = (type === 'peo' ? 'PEO' : 'PLO') + ' added.';
              self.adding = false;
            })
            .withFailureHandler(function (err) {
              self.detailError = err && err.message ? err.message : 'Unable to add ' + type.toUpperCase() + '.';
              self.adding = false;
            })
            .addProgrammeRecordApi(this.detail.mqaCode, type, this.sessionToken, this.detail.faculty);
        },
        generatePdf: function () {
          var self = this;
          this.pdf = Object.assign(emptyPdf(), { open: true, generating: true });
          google.script.run
            .withSuccessHandler(function (result) {
              self.pdf.generating = false;
              if (!result || !result.fileId) {
                self.pdf.error = 'PDF could not be generated.';
                return;
              }
              self.pdf.ready = true;
              self.pdf.filename = result.filename;
              self.pdf.url = result.url;
              self.pdf.fileId = result.fileId;
            })
            .withFailureHandler(function (err) {
              self.pdf.generating = false;
              self.pdf.error = err && err.message ? err.message : 'Unable to generate the PDF.';
            })
            .generatePdfApi(this.detail.mqaCode, this.sessionToken, this.detail.faculty);
        },
        downloadPdf: function () {
          if (this.pdf.url) window.open(this.pdf.url, '_blank');
        },
        showEmailForm: function () {
          this.pdf.emailForm = true;
          this.pdf.ready = false;
          this.pdf.error = null;
        },
        backToPdf: function () {
          this.pdf.emailForm = false;
          this.pdf.ready = true;
          this.pdf.error = null;
        },
        sendPdfEmail: function () {
          var self = this;
          if (!this.pdf.email) { this.pdf.error = 'Enter a valid email address.'; return; }
          this.pdf.sending = true;
          this.pdf.error = null;
          google.script.run
            .withSuccessHandler(function (result) {
              self.pdf.sending = false;
              if (!result || !result.sent) {
                self.pdf.error = 'Email could not be sent.';
                return;
              }
              self.pdf.emailForm = false;
              self.pdf.sent = true;
            })
            .withFailureHandler(function (err) {
              self.pdf.sending = false;
              self.pdf.error = err && err.message ? err.message : 'Unable to send the email.';
            })
            .sendPdfEmailApi(self.detail.mqaCode, this.pdf.email, this.pdf.fileId, this.sessionToken);
        },
        closePdf: function () {
          if (this.pdf.sending || this.pdf.generating) return;
          this.pdf = emptyPdf();
        },
        buildDraft: function () {
          var draft = Object.assign({}, this.editor.draft);
          draft.sc = [draft.scThinking, draft.scPracticing, draft.scBeing]
            .filter(function (v) { return !!v; }).join(', ');
          return draft;
        },
        saveEdit: function () {
          var self = this;
          this.saving = true;
          this.editError = null;
          google.script.run
            .withSuccessHandler(function (result) {
              self.applyDetail(result || {});
              self.notice = (self.editor.type === 'peo' ? 'PEO' : 'PLO') + ' updated.';
              self.saving = false;
              self.closeEdit();
            })
            .withFailureHandler(function (err) {
              self.editError = err && err.message ? err.message : 'Unable to save this record.';
              self.saving = false;
            })
            .saveProgrammeRecordApi(this.detail.mqaCode, this.editor.type, this.buildDraft(), this.sessionToken, this.detail.faculty);
        }
      },
      mounted: function () {
        try {
          var saved = localStorage.getItem('ggn-lang');
          if (saved && ['ms', 'en', 'ar'].indexOf(saved) !== -1) this.lang = saved;
        } catch (e) {}
        if (this.page === 'programmes') {
          this.openOwnFaculty();
          if (this.canManageReview && !this.summary) this.loadSummary();
        }
        if (this.review && this.review.currentText) this.review.draft = this.review.currentText;
      }
    });
  }

  document.addEventListener('DOMContentLoaded', initApp);
</script>
